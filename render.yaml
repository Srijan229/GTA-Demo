services:
  - type: web
    name: gta-application-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Database__Provider
        value: Sqlite
      - key: ConnectionStrings__GtaDatabase
        value: Data Source=/tmp/gta-application-demo.db
      - key: Database__ApplyMigrations
        value: "false"
      - key: DocumentStorage__RootPath
        value: /tmp/gta-application-documents
      - key: DocumentStorage__MaximumBytes
        value: "10485760"
      - key: DemoAccess__Enabled
        value: "true"
      - key: DemoAccess__Username
        value: gta-demo
      - key: DemoAccess__Password
        sync: false
      - key: Email__SmtpHost
        value: localhost
      - key: Email__SmtpPort
        value: "2525"
      - key: Email__FromAddress
        value: gta-application@example.test
